definitions:
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RegisterRequest:
    properties:
      date_of_birth:
        example: "1990-01-31"
        format: date
        type: string
      email:
        example: jane.doe@example.com
        type: string
      first_name:
        example: Jane
        maxLength: 100
        minLength: 3
        type: string
      last_name:
        example: Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: Str0ngPassw0rd!
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: janedoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - date_of_birth
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  dto.RegisterResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      date_of_birth:
        example: "1990-01-31"
        format: date
        type: string
      email:
        example: jane.doe@example.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 3f6c1c1e-8a52-4a8e-9a6b-2f1f0f6a9b10
        type: string
      is_active:
        example: true
        type: boolean
      last_name:
        example: Doe
        type: string
      role_id:
        example: 1
        type: integer
      updated_at:
        type: string
      username:
        example: janedoe
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login a user and return a JWT
      parameters:
      - description: User login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Login a user
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad request (invalid data or user under 18)
          schema:
            type: string
        "409":
          description: Email or username already exists
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Register a new user
      tags:
      - Authentication
swagger: "2.0"
